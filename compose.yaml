services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailx-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-mailx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailx} -d ${POSTGRES_DB:-mailx}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF gives local queue-restart testing real durability; RDB alone
    # can lose the last snapshot interval, which defeats the point of
    # testing "does a queued job survive a Redis restart".
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mailx}:${POSTGRES_PASSWORD:-mailx-dev-only}@postgres:5432/${POSTGRES_DB:-mailx}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  mailx:
    build: .
    environment:
      MAILX_SMTP_ADDR: ":2525"
      MAILX_STORAGE_ROOT: "/data"
    volumes:
      - mailx-data:/data
    ports:
      - "127.0.0.1:2525:2525"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  mailx-data:
