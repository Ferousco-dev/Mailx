services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailx-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-mailx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailx} -d ${POSTGRES_DB:-mailx}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF gives local queue-restart testing real durability; RDB alone
    # can lose the last snapshot interval, which defeats the point of
    # testing "does a queued job survive a Redis restart".
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mailx}:${POSTGRES_PASSWORD:-mailx-dev-only}@postgres:5432/${POSTGRES_DB:-mailx}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  mailx:
    build:
      context: .
      args:
        VERSION: ${MAILX_VERSION:-dev}
        COMMIT: ${MAILX_COMMIT:-unknown}
    environment:
      MAILX_SMTP_ADDR: ":2525"
      # v0.23 observability: structured logs plus a separate operator
      # listener (/metrics, /health/live, /health/ready), loopback-published.
      MAILX_LOG_LEVEL: ${MAILX_LOG_LEVEL:-info}
      MAILX_LOG_FORMAT: ${MAILX_LOG_FORMAT:-json}
      MAILX_OBSERVABILITY_ADDR: ":9090"
      # v0.24 outbound SMTP TLS: opportunistic (default) or required.
      MAILX_SMTP_TLS_POLICY: ${MAILX_SMTP_TLS_POLICY:-opportunistic}
      MAILX_STORAGE_ROOT: "/data"
      MAILX_HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-mailx}:${POSTGRES_PASSWORD:-mailx-dev-only}@postgres:5432/${POSTGRES_DB:-mailx}?sslmode=disable
      REDIS_ADDR: redis:6379
      # v0.19 API-key verifier pepper — see internal/auth's package doc.
      # Dev-only placeholder; never a real secret in this repo.
      MAILX_API_KEY_PEPPER: ${MAILX_API_KEY_PEPPER:-local-dev-pepper-not-for-production}
      # Explicitly insecure local-development values. Production must provide
      # a random base64 32-byte key and leave private/HTTP destinations off.
      MAILX_WEBHOOK_MASTER_KEY: ${MAILX_WEBHOOK_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      # DKIM private-key encryption key. Dev-only placeholder that differs from the
      # webhook key; production must provide its own random base64 32-byte key.
      MAILX_DKIM_MASTER_KEY: ${MAILX_DKIM_MASTER_KEY:-AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=}
      MAILX_WEBHOOK_ALLOW_INSECURE: ${MAILX_WEBHOOK_ALLOW_INSECURE:-true}
    volumes:
      - mailx-data:/data
    ports:
      - "127.0.0.1:2525:2525"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  mailx-data:
