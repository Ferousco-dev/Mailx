<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">MailX architecture</title><desc id="desc">SMTP and REST API inputs flow through durable state and scheduling to delivery workers, lifecycle events, and signed webhooks</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1F33"/><stop offset="1" stop-color="#102A43"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#6C8EAD"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020817" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="610" rx="26" fill="#F5F8FC"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="60" y="64" fill="#102A43" font-size="28" font-weight="750">MailX processing model</text>
    <text x="60" y="94" fill="#627D98" font-size="16">Durable state remains authoritative; queues, logs, and webhooks observe or schedule it.</text>
    <g fill="none" stroke="#6C8EAD" stroke-width="3" marker-end="url(#arrow)"><path d="M222 205H316"/><path d="M222 331H316"/><path d="M508 268H592"/><path d="M780 268H866"/><path d="M1003 334v76"/><path d="M866 489H780"/><path d="M592 489H508"/><path d="M412 410v-76"/></g>
    <g filter="url(#shadow)">
      <rect x="58" y="155" width="164" height="100" rx="18" fill="url(#panel)"/><rect x="58" y="281" width="164" height="100" rx="18" fill="url(#panel)"/>
      <rect x="316" y="205" width="192" height="129" rx="18" fill="#fff"/><rect x="592" y="205" width="188" height="129" rx="18" fill="#fff"/><rect x="866" y="205" width="274" height="129" rx="18" fill="#fff"/>
      <rect x="866" y="410" width="274" height="126" rx="18" fill="#fff"/><rect x="592" y="426" width="188" height="126" rx="18" fill="#fff"/><rect x="316" y="410" width="192" height="142" rx="18" fill="#fff"/>
    </g>
    <g text-anchor="middle">
      <text x="140" y="198" fill="#6EE7FF" font-size="18" font-weight="700">SMTP</text><text x="140" y="225" fill="#B7C9DC" font-size="14">receiver</text>
      <text x="140" y="324" fill="#BDB9FF" font-size="18" font-weight="700">HTTP</text><text x="140" y="351" fill="#B7C9DC" font-size="14">tenant API</text>
      <text x="412" y="250" fill="#102A43" font-size="18" font-weight="700">Ingestion</text><text x="412" y="279" fill="#627D98" font-size="14">validation · MIME</text><text x="412" y="302" fill="#627D98" font-size="14">authentication</text>
      <text x="686" y="250" fill="#102A43" font-size="18" font-weight="700">PostgreSQL</text><text x="686" y="279" fill="#627D98" font-size="14">lifecycle truth</text><text x="686" y="302" fill="#627D98" font-size="14">outbox · attempts</text>
      <text x="1003" y="250" fill="#102A43" font-size="18" font-weight="700">Redis queue</text><text x="1003" y="279" fill="#627D98" font-size="14">available jobs · leases</text><text x="1003" y="302" fill="#627D98" font-size="14">retry scheduling</text>
      <text x="1003" y="457" fill="#102A43" font-size="18" font-weight="700">Delivery workers</text><text x="1003" y="486" fill="#627D98" font-size="14">DNS MX · SMTP transfer</text><text x="1003" y="509" fill="#627D98" font-size="14">durable outcomes</text>
      <text x="686" y="473" fill="#102A43" font-size="18" font-weight="700">Events</text><text x="686" y="502" fill="#627D98" font-size="14">immutable lifecycle</text><text x="686" y="525" fill="#627D98" font-size="14">records</text>
      <text x="412" y="457" fill="#102A43" font-size="18" font-weight="700">Signed webhooks</text><text x="412" y="486" fill="#627D98" font-size="14">durable fan-out</text><text x="412" y="509" fill="#627D98" font-size="14">retries · inspection</text>
    </g>
    <g transform="translate(58 568)"><rect width="14" height="14" rx="3" fill="#102A43"/><text x="23" y="12" fill="#627D98" font-size="13">Protocol and API boundary</text><rect x="210" width="14" height="14" rx="3" fill="#fff" stroke="#D9E2EC"/><text x="233" y="12" fill="#627D98" font-size="13">Durable or coordinated internal component</text></g>
  </g>
</svg>
